global:
  scrape_interval: 10s

scrape_configs:
  - job_name: catalog-api
    static_configs:
      - targets: ["catalog-api:8080"]
  - job_name: ordering-api
    static_configs:
      - targets: ["ordering-api:8080"]
  - job_name: delivery-api
    static_configs:
      - targets: ["delivery-api:8080"]
  - job_name: delivery-worker
    static_configs:
      - targets: ["delivery-worker:8080"]
  - job_name: notification-api
    static_configs:
      - targets: ["notification-api:8080"]
  - job_name: identity-api
    static_configs:
      - targets: ["identity-api:8080"]
